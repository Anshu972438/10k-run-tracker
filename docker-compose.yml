services:
  postgres:
    image: postgres:16
    container_name: run-tracker-db
    environment:
      POSTGRES_DB: run_tracker
      POSTGRES_USER: runtracker
      POSTGRES_PASSWORD: runtracker
    ports:
      - "5433:5432"
    volumes:
      - run-tracker-data:/var/lib/postgresql/data

volumes:
  run-tracker-data:
